name: Sync Forcelog tracking

# Remplace le cron natif Vercel (limité à 1x/jour sur le plan Hobby) :
# GitHub Actions n'a pas cette limite, donc on peut appeler l'endpoint
# toutes les 2h (12x/jour) gratuitement.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {} # permet de déclencher manuellement depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-tracking
        env:
          CRM_BASE_URL: ${{ vars.CRM_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Nettoyage défensif : une variable/secret GitHub Actions copié-
          # collé depuis un champ web peut embarquer un \r ou \n invisible
          # en fin de valeur (vécu en pratique : CRM_BASE_URL faisait 38
          # caractères pour une URL de 36, cassant le parsing de curl avec
          # "URL malformée"). On force donc CRM_BASE_URL/CRON_SECRET
          # propres avant tout usage plutôt que de dépendre d'une saisie
          # parfaite côté GitHub.
          CRM_BASE_URL=$(printf '%s' "$CRM_BASE_URL" | tr -d '\r\n')
          CRON_SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')
          http_code=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$CRM_BASE_URL/api/cron/sync-tracking" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "Réponse HTTP $http_code :"
          cat response.json
          if [ "$http_code" -ge 400 ]; then
            echo "::error::sync-tracking a échoué avec le code $http_code"
            exit 1
          fi

      # Complète le sync ci-dessus pour les statuts que l'API publique ne
      # permet pas d'atteindre de façon fiable (pagination/filtre cassés,
      # vérifié en pratique) : passe par le dashboard web Forcelog à la
      # place. Doit tourner ici (GitHub Actions), jamais sur Vercel —
      # Playwright n'y est pas adapté (pas de Chromium préinstallé,
      # contraintes serverless).
      - name: Checkout
        if: always()
        uses: actions/checkout@v4

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        if: always()
        run: npm ci

      - name: Installer Chromium (Playwright)
        if: always()
        run: npx playwright install --with-deps chromium

      - name: Synchroniser via le dashboard web Forcelog (colis + CRBT)
        if: always()
        env:
          FORCELOG_WEB_EMAIL: ${{ secrets.FORCELOG_WEB_EMAIL }}
          FORCELOG_WEB_PASSWORD: ${{ secrets.FORCELOG_WEB_PASSWORD }}
          CRM_BASE_URL: ${{ vars.CRM_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/sync-forcelog-web.js
